services:
  # --- Infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "127.0.0.1:2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # --- Application Services ---
  event-api:
    build:
      context: .
      dockerfile: services/event-api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - KAFKA_BROKER=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
      - EVENT_API_KEY=${EVENT_API_KEY:?set EVENT_API_KEY in .env}
    depends_on:
      kafka:
        condition: service_started
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "${ALLOY_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}"
        syslog-format: rfc5424micro
        tag: event-api

  event-processor:
    build:
      context: .
      dockerfile: services/event-processor/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_URL=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
      - METRICS_PORT=8081
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "${ALLOY_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}"
        syslog-format: rfc5424micro
        tag: event-processor

  query-api:
    build:
      context: .
      dockerfile: services/query-api/Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - PORT=8083
      - REDIS_URL=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
    depends_on:
      redis:
        condition: service_started
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "${ALLOY_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}"
        syslog-format: rfc5424micro
        tag: query-api

  ml-predictor:
    build: ./services/ml-predictor
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_URL=redis:6379
      - MODEL_DIR=/app/models
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "${ALLOY_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}"
        syslog-format: rfc5424micro
        tag: ml-predictor

  match-simulator:
    build:
      context: .
      dockerfile: services/match-simulator/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - EVENT_API_URL=http://event-api:8080
      - EVENT_API_KEY=${EVENT_API_KEY:?set EVENT_API_KEY in .env}
      - SIMULATOR_MATCH_ID=ars-mci-2026
      - SIMULATOR_HOME_TEAM=Arsenal
      - SIMULATOR_AWAY_TEAM=Manchester City
      - SIMULATOR_EVENT_INTERVAL=${SIMULATOR_EVENT_INTERVAL:-2s}
      # Set SIMULATOR_SEED to replay the exact same match; unset gives a
      # different match each run.
      - SIMULATOR_SEED=${SIMULATOR_SEED:-}
      # Set to false to serve /health only, e.g. so a deterministic test
      # can drive its own events without a background match racing it.
      - SIMULATOR_AUTO_START=${SIMULATOR_AUTO_START:-true}
      - HEALTH_PORT=8082
    depends_on:
      event-api:
        condition: service_started
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "${ALLOY_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}"
        syslog-format: rfc5424micro
        tag: match-simulator

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - event-api
      - query-api
      - ml-predictor

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:v1.21.2
    user: "473:473"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:1514:1514"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    tmpfs:
      - /tmp:uid=473,gid=473,mode=1770
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1514'"]
      interval: 2s
      timeout: 1s
      retries: 15
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  alloy-data:
