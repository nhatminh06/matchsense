apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-simulator
  namespace: matchsense
  labels:
    app: match-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-simulator
  template:
    metadata:
      labels:
        app: match-simulator
    spec:
      enableServiceLinks: false
      containers:
        - name: match-simulator
          image: ghcr.io/nhatminh06/match-simulator@sha256:2d17e7a8ec7040e908b9970681692da781582adadbc808867c877956e5c1f119
          ports:
            - containerPort: 8082
          env:
            - name: EVENT_API_URL
              value: "http://event-api:8080"
            - name: SIMULATOR_MATCH_ID
              value: "ars-mci-2026"
            - name: SIMULATOR_HOME_TEAM
              value: "Arsenal"
            - name: SIMULATOR_AWAY_TEAM
              value: "Manchester City"
            - name: SIMULATOR_EVENT_INTERVAL
              value: "2s"
            - name: SIMULATOR_AUTO_START
              value: "true"
            - name: HEALTH_PORT
              value: "8082"
          resources:
            requests:
              memory: "16Mi"
              cpu: "25m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
