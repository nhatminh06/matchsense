version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/services/event-api"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/event-processor"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/query-api"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/match-simulator"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/ml-predictor"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/services/event-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/event-processor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/query-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/match-simulator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/ml-predictor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
