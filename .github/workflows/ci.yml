name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege default; individual jobs don't need anything beyond
# reading the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go checks (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [event-api, event-processor, query-api, match-simulator]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: gofmt check
        working-directory: services/${{ matrix.service }}
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: go build
        working-directory: services/${{ matrix.service }}
        run: go build ./...

      - name: go test (race detector)
        working-directory: services/${{ matrix.service }}
        # Most services have no test files yet; `go test` exits 0 with
        # "[no test files]" in that case, so this is honest rather than a
        # fake pass — it starts enforcing real coverage the moment tests
        # are added.
        run: go test -race ./...

  python-checks:
    name: Python checks (ml-predictor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml-predictor/requirements.txt

      - name: Install dependencies
        working-directory: services/ml-predictor
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff, pyflakes rules)
        working-directory: services/ml-predictor
        # Scoped to F (pyflakes: unused imports, undefined names, etc.)
        # rather than full style/formatting, since the codebase isn't
        # ruff-formatted yet and a repo-wide reformat is out of scope here.
        run: ruff check --select F .

      - name: Compile check
        working-directory: services/ml-predictor
        run: python -m compileall .

      - name: Run tests
        working-directory: services/ml-predictor
        # Guarded rather than unconditional so this keeps working if a
        # service ever ships with no tests again: it fails loudly only
        # when test files exist and actually fail, not when there simply
        # aren't any yet. httpx is required by fastapi.testclient.TestClient.
        run: |
          if compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pip install pytest httpx
            pytest -v
          else
            echo "No test files found for ml-predictor yet — skipping pytest."
          fi

  ml-train-checks:
    name: Python checks (ml/train)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/train/requirements.txt

      - name: Install dependencies
        working-directory: ml/train
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff, pyflakes rules)
        working-directory: ml/train
        run: ruff check --select F .

      - name: Compile check
        working-directory: ml/train
        run: python -m compileall .

      - name: Run tests
        working-directory: ml/train
        # Fixture-sized (tens of rows), not the real 10000/5000-row
        # datasets -- fast enough for every PR, not a full training run.
        run: pytest -v

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install yamllint
        run: pip install yamllint==1.35.1
      - name: Run yamllint
        run: |
          cat > /tmp/yamllint.yml <<'EOF'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy: disable
            braces:
              max-spaces-inside: 1
          EOF
          yamllint -c /tmp/yamllint.yml .

  actionlint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: |
          curl -sSL "https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash" | bash -s -- 1.7.12
      - name: Run actionlint
        run: ./actionlint -color

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: [event-api, event-processor, query-api, match-simulator, ml-predictor]
    steps:
      - uses: actions/checkout@v7
      - name: Download hadolint
        run: |
          curl -sSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64"
          chmod +x /usr/local/bin/hadolint
      - name: Run hadolint
        # error-only: these Dockerfiles intentionally don't pin apk package
        # versions (DL3018) so `apk add ca-certificates` keeps tracking
        # whatever the pinned Alpine base image ships, instead of going
        # stale and blocking routine Alpine base-image bumps.
        run: hadolint --failure-threshold error services/${{ matrix.service }}/Dockerfile

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yaml
        env:
          GRAFANA_ADMIN_PASSWORD: harmless-ci-only-password
        run: |
          docker compose config --quiet
          config=$(docker compose config --format json)
          jq -e '[.services[].ports[]? | select(.host_ip != "127.0.0.1")] | length == 0' \
            <<<"$config"
          for service in event-api event-processor query-api ml-predictor match-simulator; do
            jq -e --arg service "$service" \
              '.services[$service].logging.driver == "syslog" and
               .services[$service].logging.options.tag == $service' <<<"$config"
          done
          ! grep -RqiE 'promtail|docker\.sock' \
            docker-compose.yaml observability gitops/infrastructure/loki
      - name: Require Grafana password
        run: |
          if env -u GRAFANA_ADMIN_PASSWORD docker compose --env-file /dev/null config --quiet 2>/dev/null; then
            echo 'docker compose config unexpectedly accepted a missing GRAFANA_ADMIN_PASSWORD' >&2
            exit 1
          fi

  grafana-kustomize:
    name: Grafana security configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Grafana Kustomize and security settings
        run: |
          kubectl kustomize gitops/infrastructure/grafana > /tmp/grafana.yaml
          grep -q 'type: ClusterIP' /tmp/grafana.yaml
          grep -q 'name: grafana-admin' /tmp/grafana.yaml
          grep -q 'key: admin-password' /tmp/grafana.yaml
          grep -q 'optional: false' /tmp/grafana.yaml
          if grep -q 'nodePort:' /tmp/grafana.yaml; then exit 1; fi
          if grep -A1 'name: GF_SECURITY_ADMIN_PASSWORD' /tmp/grafana.yaml | grep -q 'value:'; then exit 1; fi

  logging-pipeline:
    name: Alloy to Loki logging pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_ADMIN_PASSWORD: harmless-ci-only-password
    steps:
      - uses: actions/checkout@v7
      - name: Start Loki and Alloy
        run: docker compose up -d loki alloy
      - name: Send and query a real log
        run: |
          cleanup() { docker compose down -v; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ready >/dev/null && \
               bash -c 'exec 3<>/dev/tcp/127.0.0.1/1514'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose logs loki alloy
              exit 1
            fi
            sleep 2
          done

          marker="matchsense-alloy-smoke-${GITHUB_RUN_ID}"
          docker run --rm \
            --log-driver=syslog \
            --log-opt syslog-address=tcp://127.0.0.1:1514 \
            --log-opt syslog-format=rfc5424micro \
            --log-opt tag=logging-smoke \
            alpine:3.24 echo "$marker"

          for attempt in {1..30}; do
            if curl -fsSG http://127.0.0.1:3100/loki/api/v1/query_range \
              --data-urlencode 'query={service_name="logging-smoke"}' \
              | jq -e --arg marker "$marker" \
                '.data.result[].values[][1] | contains($marker)' >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs loki alloy
          exit 1

  kustomize-build:
    name: Kustomize build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: [event-api, event-processor, query-api, match-simulator, ml-predictor]
    steps:
      - uses: actions/checkout@v7
      - name: kubectl kustomize
        run: kubectl kustomize gitops/apps/${{ matrix.service }}/overlays/dev > /dev/null

  loki-kustomize:
    name: Loki and Alloy Kustomize security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests and collector privileges
        run: |
          kubectl kustomize gitops/infrastructure/loki > /tmp/loki.yaml
          grep -q 'image: grafana/alloy:v1.21.2' /tmp/loki.yaml
          grep -q 'kind: Role' /tmp/loki.yaml
          grep -q 'pods/log' /tmp/loki.yaml
          grep -q 'runAsNonRoot: true' /tmp/loki.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/loki.yaml
          ! grep -qiE 'promtail|docker\.sock|hostPath:|kind: DaemonSet|kind: ClusterRole' /tmp/loki.yaml

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose
