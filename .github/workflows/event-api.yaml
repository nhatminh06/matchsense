name: event-api CI

on:
  push:
    branches: [main]
    paths:
      - 'services/event-api/**'
      - 'services/common/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/event-api/**'
      - 'services/common/**'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/event-api

# Secret scanning, formatting/lint/build checks, and PR-title validation
# for this service all live in the shared ci.yml / pr-title.yml workflows
# (triggered by the same path filters), so they aren't duplicated here.
permissions:
  contents: read

concurrency:
  group: deploy-event-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only runs after a merge to main (or a manual dispatch) — never for a
    # pull_request event — so it only ever builds/pushes/signs a commit
    # that already passed PR review and the ci.yml checks.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/event-api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-event-api
          path: sbom.cdx.json
          retention-days: 90

      - name: Push image to GHCR
        id: push
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ github.sha }})
          DIGEST_HASH=$(echo "$DIGEST" | cut -d'@' -f2)
          echo "digest=$DIGEST_HASH" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: Update GitOps manifest with digest
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          sed -i "s|image: ghcr.io/.*/event-api[:@].*|image: ghcr.io/${{ github.repository_owner }}/event-api@${DIGEST}|" gitops/apps/event-api/base/deployment.yaml

      - name: Open GitOps update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Falls back to GITHUB_TOKEN if no bot credential is configured.
          # A PR opened with the default GITHUB_TOKEN will NOT trigger
          # other workflows (e.g. ci.yml's pull_request checks) on itself —
          # that's a GitHub Actions safeguard against recursive runs, not a
          # bug here. To get automatic status checks on this GitOps PR,
          # add a fine-grained PAT (repo scope, contents+PRs read/write) as
          # the MATCHSENSE_BOT_TOKEN repository secret; until then, this PR
          # is safe to review and merge manually, just without an
          # automatically-triggered check run.
          token: ${{ secrets.MATCHSENSE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update event-api image digest"
          branch: gitops/event-api-${{ github.sha }}
          delete-branch: true
          title: "chore(gitops): update event-api image digest"
          labels: devops
          add-paths: gitops/apps/event-api/base/deployment.yaml
          body: |
            Automated image digest update for **event-api**.

            - Source commit: ${{ github.sha }}
            - Image: `${{ env.IMAGE }}@${{ steps.push.outputs.digest }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Trivy scan: passed (blocks on CRITICAL severity)
            - SBOM: uploaded as workflow artifact `sbom-event-api`

            Merging this only updates the deployed image digest for ArgoCD
            to pick up — no application code changes are included.
